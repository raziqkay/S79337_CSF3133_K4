<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>e-Café Campus</title>
<style>
 /* Error 1 (Line 7): HTML comment syntax used inside the style block; CSS needs /* ... */ comments. */
/*Navigation bar */
/* Error 2 (Line 11): list-style-type: no is invalid; it should be none. */
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;}
a:link { color: #1A5276; }
/*Error 3 (Lines 17-18): link states in wrong order; visited must come before hover. */
a:visited {color: #7D3C98;}
a:hover {color: #E67E22;} 
a:active {color: #C0392B;}
/* Error 4 (Line 21): text-decoration: overlined is invalid; it should be overline. */
h1 {text-decoration: overline;}
/* Error 5 (Line 23): missing colon after color in the p rule. */
p {color: #333333; text-align: justify;}
/* Error 6 (Line 29): the #intro rule is missing its closing brace
   Error 7 (Line 26): #intro is an ID selector but the HTML uses class="intro" */
.intro {
font-size: 18px;
background-color: #FDEBD0;
}
/*Error 8 (Line 31): highlight selector has no dot, it should be .highlight*/
.highlight {
font-weight: bold;
color: #C0392B;
}
</style>
</head>
<body>

<header>
<h1>e-Café Campus</h1>
</header>
<nav>
<ul>
    <!--Error 9 (Line 45): href="menu" does not point to an id; it should be href="#menu". -->
<li><a href="#menu">Menu</a></li>
<li><a href="#video">Video</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>
<section id="menu">
<h2>Today's Menu</h2>
<p class="intro">Freshly brewed coffee and local delights every day.</p>
<article class="item">
<h3>Kopi Tarik</h3>
<p>Only <span class="highlight">RM 3.50</span></p>
</article>
<!-- Error 10 (Lines 58): the id="item" is duplicated; use class="item" instead.-->
<article class="item">
<h3>Nasi Lemak</h3>
<p>Only <span class="highlight">RM 5.00</span></p>
</article>
</section>
<section id="video">
<h2>Watch Our Story</h2>
<!-- Error 11 (Line 66): the video tag has no controls attribute, so it cannot be played.-->
<video width="400" height="300" controls>
    <!-- Error 12 (Line 68): type="mp4" is not a valid MIME type; it should be video/mp4.-->
<source src="cafe.mp4" type="video/mp4">
Your browser does not support the video tag.
</video>
</section>
<footer id="contact">
<p>&copy; 2026 e-Café Campus</p>
</footer>
</body>
</html>
